<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plateforme d'assurance – Paiement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213d; --muted:#5b6679; --paper:#f4f7fa; --card:#ffffff;
  --teal:#0e7c7b; --teal-d:#0a5f5e; --amber:#e8a33d; --line:#dde3ea;
  --err:#b42318; --errbg:#fef3f2; --ok:#067647;
}
@media (prefers-color-scheme:dark){
  :root{--ink:#e8edf5; --muted:#9aa6b8; --paper:#0e1522; --card:#17212f; --line:#2a3647; --teal:#2bb3b1; --teal-d:#4fd0ce; --errbg:#2a1614; --err:#fda29b}
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;line-height:1.5}
header{display:flex;align-items:center;gap:.7rem;padding:1.2rem clamp(1rem,4vw,3rem)}
.logo{width:38px;height:38px;border-radius:10px;background:var(--teal);display:grid;place-items:center}
.logo svg{width:22px;height:22px}
header b{font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
main{max-width:980px;margin:0 auto;padding:1rem clamp(1rem,4vw,2rem) 4rem;display:grid;grid-template-columns:1fr 1fr;gap:2.5rem;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr;gap:1.5rem}}
h1{font-size:clamp(1.9rem,4.5vw,2.8rem);line-height:1.1;letter-spacing:-.03em;font-weight:800;margin:.5rem 0 1rem}
.intro p{color:var(--muted);max-width:42ch;margin:0}
form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.5rem;display:grid;gap:1rem;box-shadow:0 10px 30px -18px rgba(20,33,61,.35)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:480px){.row{grid-template-columns:1fr}}
label{display:grid;gap:.35rem;font-size:.85rem;font-weight:700}
input{font:inherit;font-weight:500;padding:.75rem .85rem;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,124,123,.2)}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:.85rem 1.1rem;background:var(--teal);color:#fff;cursor:pointer;transition:background .2s,transform .1s}
button:hover{background:var(--teal-d)}
button:active{transform:scale(.98)}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
button:disabled{opacity:.7;cursor:wait}
#out{grid-column:1/-1}
.msg{background:var(--errbg);color:var(--err);border-radius:12px;padding:1rem 1.2rem;font-weight:500;animation:pop .3s ease}
.receipt{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:1rem;transform-origin:top;animation:unfold .55s cubic-bezier(.2,.8,.2,1)}
.receipt .top{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:1.2rem 1.5rem;border-bottom:2px dashed var(--line)}
.receipt .top small{display:block;color:var(--muted);font-weight:500}
.receipt .top strong{font-size:1.15rem}
.receipt .amount{padding:1.4rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.amount .num{font-size:2.4rem;font-weight:800;letter-spacing:-.03em}
.amount .num span{color:var(--amber);font-size:1.3rem;margin-left:.25rem}
.pill{display:inline-block;background:rgba(14,124,123,.12);color:var(--teal-d);padding:.2rem .7rem;border-radius:99px;font-weight:700;font-size:.85rem}
.toast{margin:.6rem 1.5rem 1.2rem;color:var(--ok);font-weight:700;animation:pop .3s ease}
@keyframes unfold{from{opacity:0;transform:scaleY(.85) translateY(-8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding-bottom:2rem}
</style>
</head>
<body>
<header>
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg></div>
  <b>Plateforme d'assurance</b>
</header>

<main>
  <section class="intro">
    <h1>Consultez et réglez votre assurance.</h1>
    <p>Saisissez vos informations personnelles et votre code d'assurance pour voir le type de contrat et le montant à payer.</p>
  </section>

  <form id="f" autocomplete="off" novalidate>
    <div class="row">
      <label>Prénom<input id="first" required placeholder="Prénom"></label>
      <label>Nom<input id="last" required placeholder="Nom"></label>
    </div>
    <label>Numéro d'identité (CNI)<input id="id" required placeholder="Example : 'BW1234' "></label>
    <label>Code d'assurance<input id="code" required placeholder="Example : '12345' "></label>
    <button id="btn" type="submit">Vérifier mon assurance</button>
  </form>

  <section id="out" aria-live="polite"></section>
</main>
<footer>© <span id="y"></span> Plateforme d'assurance</footer>

<script>
const DB_FILE = 'DB.txt';
document.getElementById('y').textContent = new Date().getFullYear();

// Normalise : minuscules, sans accents, sans espaces superflus
const norm = s => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();

// Lit DB.txt : chaque contrat commence par une ligne "First."
// La 1re ligne "AC." = code d'assurance, la 2e ligne "AC." = coût.
function parseDB(text){
  const recs = []; let r = null;
  for (let raw of text.split(/\r?\n/)){
    const line = raw.replace(/\s+"[^"]*"\s*$/, '').trim(); // retire les commentaires entre guillemets
    const m = line.match(/^([A-Za-z]+)\.(.*)$/);
    if(!m) continue;
    const key = m[1].toUpperCase(), val = m[2].trim();
    if(key==='FIRST'){ r = {first:val}; recs.push(r); }
    else if(!r) continue;
    else if(key==='LAST') r.last = val;
    else if(key==='ID') r.id = val;
    else if(key==='AT') r.type = val;
    else if(key==='AC'){ if(r.code===undefined) r.code = val; else r.cost = val; }
  }
  return recs;
}

const fmtCost = c => (c||'').replace(/^(\d[\d\s.,]*)\s*([A-Za-z]+)$/, '$1').trim();
const unitCost = c => ((c||'').match(/[A-Za-z]+$/)||['DH'])[0];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const out = document.getElementById('out');
const btn = document.getElementById('btn');

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const q = {
    first: norm(first.value), last: norm(last.value),
    id: norm(id.value), code: norm(code.value)
  };
  if(!q.first || !q.last || !q.id || !q.code){
    out.innerHTML = '<div class="msg">Veuillez remplir tous les champs.</div>'; return;
  }
  btn.disabled = true; btn.textContent = 'Vérification…';
  try{
    const res = await fetch(DB_FILE + '?t=' + Date.now());
    if(!res.ok) throw new Error('http');
    const recs = parseDB(await res.text());
    const found = recs.filter(r => norm(r.first)===q.first && norm(r.last)===q.last && norm(r.id)===q.id && norm(r.code)===q.code);
    if(!found.length){
      out.innerHTML = '<div class="msg">Aucune assurance trouvée. Vérifiez votre prénom, nom, numéro d\'identité et code d\'assurance.</div>';
    } else {
      out.innerHTML = found.map((r,i) => `
        <article class="receipt">
          <div class="top">
            <div><small>Assuré</small><strong>${esc(r.first)} ${esc(r.last)}</strong></div>
            <div><small>Identité</small><strong>${esc(r.id)}</strong></div>
            <div><small>Code</small><strong>${esc(r.code)}</strong></div>
          </div>
          <div class="amount">
            <div><span class="pill">${esc(r.type||'Assurance')}</span><div style="color:var(--muted);margin-top:.4rem">Montant à payer</div></div>
            <div class="num">${esc(fmtCost(r.cost))}<span>${esc(unitCost(r.cost))}</span></div>
          </div>
          <div style="padding:0 1.5rem 1.4rem"><button data-pay="${i}">Payer maintenant</button></div>
        </article>`).join('');
    }
  }catch(err){
    out.innerHTML = '<div class="msg">Impossible de lire la base de données (DB.txt). Ouvrez le site via GitHub Pages ou un serveur local, pas directement depuis le fichier.</div>';
  }
  btn.disabled = false; btn.textContent = 'Vérifier mon assurance';
});

// Bouton de paiement (démonstration : aucun vrai paiement n'est effectué)
out.addEventListener('click', e => {
  const b = e.target.closest('[data-pay]'); if(!b) return;
  b.disabled = true; b.textContent = 'Paiement en cours…';
  setTimeout(() => {
    b.parentElement.innerHTML = '<div class="toast" style="margin:0">✓ Paiement enregistré. Merci !</div>';
  }, 1200);
});
</script>
</body>
</html>
